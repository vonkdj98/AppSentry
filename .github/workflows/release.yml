name: Release

# Pushing a tag named v<version> (as in v2.1.9) publishes that version: it builds the
# single-file exe with publish.ps1 and creates the GitHub release with it. The version itself
# lives in Directory.Build.props and the notes in CHANGELOG.md, so the tag should match both.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish the single-file exe
        run: pwsh -File publish.ps1

      - name: Install the WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build the MSI and add its checksum
        shell: pwsh
        run: |
          pwsh -File installer/build-installer.ps1
          $hash = (Get-FileHash dist/AppSentry-x64.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AppSentry-x64.msi" | Add-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Take the release notes from the CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = @(Get-Content CHANGELOG.md)
          $start = -1
          $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0) { if ($lines[$i] -like "## $version*") { $start = $i } }
            elseif ($lines[$i] -like "## *") { $end = $i; break }
          }
          if ($start -lt 0 -or $end -le $start + 1) {
            Write-Host "::warning::CHANGELOG.md has no section for $version; releasing without notes."
            "AppSentry ${{ github.ref_name }} — see CHANGELOG.md." | Set-Content dist/notes.md -Encoding utf8
          } else {
            ($lines[($start + 1)..($end - 1)] -join "`n").Trim() | Set-Content dist/notes.md -Encoding utf8
            Write-Host "Release notes: the CHANGELOG section for $version."
          }

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "AppSentry ${{ github.ref_name }}" \
            --notes-file dist/notes.md \
            --verify-tag \
            dist/AppSentry.exe#AppSentry.exe \
            dist/AppSentry-x64.msi#AppSentry-x64.msi \
            dist/SHA256SUMS.txt#SHA256SUMS.txt
