name: Release

# Pushing a tag named v<version> (as in v2.1.9) publishes that version: it builds the
# single-file exe with publish.ps1 and creates the GitHub release with it. The version itself
# lives in Directory.Build.props and the notes in CHANGELOG.md, so the tag should match both.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: windows-latest

    env:
      # wingetcreate reads its GitHub token from here (the documented way to pass it in CI, so it never reaches a
      # command line). A personal access token with the repo scope, for the account that owns the winget-pkgs fork;
      # the winget step below skips itself while the secret is missing. See the README's winget section.
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish the single-file exe
        run: pwsh -File publish.ps1

      - name: Install the WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build the MSI and add its checksum
        shell: pwsh
        run: |
          pwsh -File installer/build-installer.ps1
          $hash = (Get-FileHash dist/AppSentry-x64.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AppSentry-x64.msi" | Add-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Take the release notes from the CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $lines = @(Get-Content CHANGELOG.md)
          $start = -1
          $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0) { if ($lines[$i] -like "## $version*") { $start = $i } }
            elseif ($lines[$i] -like "## *") { $end = $i; break }
          }
          if ($start -lt 0 -or $end -le $start + 1) {
            Write-Host "::warning::CHANGELOG.md has no section for $version; releasing without notes."
            "AppSentry ${{ github.ref_name }} — see CHANGELOG.md." | Set-Content dist/notes.md -Encoding utf8
          } else {
            ($lines[($start + 1)..($end - 1)] -join "`n").Trim() | Set-Content dist/notes.md -Encoding utf8
            Write-Host "Release notes: the CHANGELOG section for $version."
          }

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "AppSentry ${{ github.ref_name }}" \
            --notes-file dist/notes.md \
            --verify-tag \
            dist/AppSentry.exe#AppSentry.exe \
            dist/AppSentry-x64.msi#AppSentry-x64.msi \
            dist/SHA256SUMS.txt#SHA256SUMS.txt

      # Every release also goes out on winget: this updates the vonkdj98.AppSentry manifest to this version and opens
      # the pull request on microsoft/winget-pkgs. wingetcreate downloads the MSI itself, so the hash, the version and
      # the ProductCode (WiX generates a fresh one every build) all come from the file that was actually shipped —
      # nothing here has to be kept in step with the installer. A red X on this step means the release is fine and
      # only the winget submission needs a hand; the command is in the README's winget section.
      - name: Submit the MSI to winget
        if: env.WINGET_CREATE_GITHUB_TOKEN != ''
        shell: pwsh
        run: |
          winget install --id Microsoft.WingetCreate -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          # winget puts its command aliases in WindowsApps, which this shell has not picked up yet.
          $env:Path = "$env:LOCALAPPDATA\Microsoft\WindowsApps;$env:Path"
          $version = "${{ github.ref_name }}".TrimStart("v")
          $download = "https://github.com/vonkdj98/AppSentry/releases/download/${{ github.ref_name }}"
          $tag = "https://github.com/vonkdj98/AppSentry/releases/tag/${{ github.ref_name }}"
          wingetcreate update vonkdj98.AppSentry --version $version --urls "$download/AppSentry-x64.msi" --release-notes-url $tag --release-date (Get-Date -Format yyyy-MM-dd) --no-open --submit
          # pwsh keeps going after a command fails, so fail the step on the submission's own exit code.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
