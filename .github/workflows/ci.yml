name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and publish (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build AppSentry.sln -c Release --nologo

      # The full suite, including the integration tests: they scan the machine and make (and undo)
      # harmless HKCU and scheduled-task changes, which on an ephemeral runner is exactly what we want.
      - name: Test the engine (storage, sources, detection, pipe)
        run: dotnet test AppSentry.Tests/AppSentry.Tests.csproj -c Release --no-build --nologo

      - name: Test the view models (filters, paging, notification rules)
        run: dotnet test AppSentry.UiTests/AppSentry.UiTests.csproj -c Release --no-build --nologo

      # Publish the same way the release does, so a broken release recipe fails a pull request
      # instead of a tag.
      - name: Publish the single-file exe
        run: pwsh -File publish.ps1

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: AppSentry-win-x64
          path: dist/AppSentry.exe
          if-no-files-found: error
